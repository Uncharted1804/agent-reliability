# Central experiment configuration — matches Table 3 "Key parameters" in the report.

base_llm:
  provider: ollama            # local open model
  model: qwen3:8b             # override with env AGENTREL_MODEL; picked by the
                              # 4-model benchmark (tied with llama3.1 on accuracy,
                              # ~40% faster, loops half as often)
  think: false                # qwen3 thinks by default: ~300 tokens a step, slow
  host: http://localhost:11434
  temperature: 0.0
  max_tokens: 1024
  request_timeout_s: 120

topologies:
  - single_react              # matches ChatGPT / Claude single-agent loop
  - orchestrator_worker       # matches LAMBDA programmer/inspector split
  - peer_tool_graph           # closest to Data Interpreter

datasets:
  - titanic
  - adult_census
  - nyc_taxi
  - missingness              # heavy-missingness table
  - olist                    # multi-table e-commerce (needs joins)

questions:
  templates_per_dataset: 10
  paraphrases_per_template: 4

faults:                       # robustness study
  - tool_failure              # a tool call returns an error / nothing
  - corrupted_output          # an intermediate output is silently mutated
  - dropped_context           # prior step's result is withheld from the model

fault_runs:
  # Phrasings per template to re-run under each fault. 1 = canonical only,
  # which keeps every template and topology represented (the dimensions
  # Delta_{T,f} is estimated across) at a third of the compute. Set to 5 for
  # the report's full 600x3 design.
  paraphrases_per_template: 1
  bootstrap_resamples: 1000   # cluster bootstrap for the Delta_{T,f} CIs

labelling:
  numeric_tolerance: 0.01     # 1% relative tolerance (epsilon in Eq.1)
  categorical: exact_match

split:
  scheme: grouped_by_template # all paraphrases of a question stay in one split
  train: 0.70
  val: 0.15
  test: 0.15
  seed: 42

runtime:
  max_agent_steps: 12         # hard cap on tool calls per run (timeout -> flagged, kept)
  run_timeout_s: 300
  log_dir: results
