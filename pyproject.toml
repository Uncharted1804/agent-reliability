[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentrel"
version = "0.1.0"
description = "Reliability and failure topology of autonomous LLM agents in data-analysis pipelines"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Shaurya Mittal Nair" },
    { name = "Pragun Kathuria" },
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "requests>=2.31",
    "scikit-learn>=1.3",
    "networkx>=3.1",
    "pyarrow>=14",            # labelled corpus is parquet
]

[project.optional-dependencies]
model = [
    "lightgbm>=4.0",
    "imbalanced-learn>=0.11",
    "matplotlib>=3.7",
]
dev = [
    "pytest>=7.4",
    "ruff>=0.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
